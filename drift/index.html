<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drift / 灯りの行方 — Shumpei Kai</title><meta name="description" content="Shumpei Kaiのインタラクティブ作品《Drift / 灯りの行方》。名前のない灯りが、夜を渡っていく。"><link rel="stylesheet" href="../studies.css"></head><body data-work="drift"><header><a href="../">SHUMPEI KAI / WORKS</a><span>STUDIES IN SLOWNESS · 004</span></header><main><div class="intro"><div><div class="label">A GENERATIVE STUDY / 2026</div><h1>Drift<span>灯りの行方</span></h1></div><p>名前のない灯りが、夜を渡っていく。</p></div><canvas tabindex="0" role="img" aria-label="青い夜の中を小さな金色の光が流れる抽象画。指やカーソルの近くで灯りが静かに揺れます。"></canvas><div class="toolbar"><div class="buttons"><button id="pause" aria-pressed="false">一時停止</button><button id="new">別の景色</button><button id="save" class="primary">画像を保存 ↗</button></div><span class="hint">指やカーソルの近くで灯りが静かに揺れます。</span></div><p id="status" role="status" aria-live="polite"></p><p class="about">流れるものを、追いかけずに眺める。遠くにある星にも、水に浮かぶ灯りにも見える粒たちが、行き先を決めずに画面を横切っていく。</p><p class="hint">保存画像は2,400 × 1,800 px。音はありません。</p></main><footer><a href="../">← ALL WORKS</a><span>© 2026 SHUMPEI KAI</span></footer><script src="../studies.js"></script></body></html>
